name = "trendpulse-backend"
main = "src/index.ts"
compatibility_date = "2024-03-06"

[[d1_databases]]
binding = "DB"
database_name = "trendpulse-db"
database_id = "YOUR-D1-DATABASE-ID"

[triggers]
crons = ["0 * * * *"] # Every hour

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "trendpulse-vectors"
